name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical source
        run: python3 tools/council_dist.py verify
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Build deterministic release artifacts
        run: python3 tools/council_dist.py release --output dist/release

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated verification image
        run: docker build --tag council-release-smoke .
      - name: Verify inside the image
        run: docker run --rm council-release-smoke
