name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical source
        run: python3 tools/council_dist.py verify
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Build deterministic release artifacts
        run: python3 tools/council_dist.py release --output dist/release

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build isolated verification image
        run: docker build --tag council-release-smoke .
      - name: Verify inside the image
        run: docker run --rm council-release-smoke
