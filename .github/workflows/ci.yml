name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical source
        run: python3 tools/council_dist.py verify
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Build deterministic release artifacts
        run: python3 tools/council_dist.py release --output dist/release

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build isolated verification image
        run: docker build --tag council-release-smoke .
      - name: Verify inside the image
        run: docker run --rm council-release-smoke
